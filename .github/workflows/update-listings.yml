name: Update listings

on:
  schedule:
    - cron: '0 13 * * *' # every day at 13:00 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch postings and rebuild README
        run: node scripts/update.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md data/listings.json; then
            echo "No changes today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/listings.json
          git commit -m "Update listings $(date -u +%Y-%m-%d)"
          git push
